# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
version=1.0.3-beta
group=dev.migzu
archives_base_name=handyphone

# Dependencies
fabric_api_version=0.166.2+26.3

# squaremap (opcional; ver build.gradle)
squaremap_api_version=1.4.4
# id da versão Fabric 1.4.4 para o Minecraft 26.3 no Modrinth (o número "1.4.4" é ambíguo entre carregadores)
squaremap_version=RcxpZMGX

# Simple Voice Chat (opcional; ver build.gradle)
voicechat_api_version=2.6.27
voicechat_version=fabric-2.6.27+26.3

# common/ (Java puro): as versões que o Minecraft 26.3 já traz, e o JUnit dos testes sem jogo
gson_version=2.14.0
slf4j_version=2.0.17
junit_version=5.13.4

# paper/ (plugin Paper, só servidor): a API e o servidor do Paper para o Minecraft 26.3
paper_api_version=26.3.build.257-stable
paper_version=26.3
# Plugins Paper opcionais do ambiente de teste (-Pvoice, -Pmap): números/ids de versão no Modrinth para o Paper 26.3
paper_voicechat_version=bukkit-2.6.27
paper_squaremap_version=YqUtyFYN
# Teste automático contra um Paper de verdade (preparePaperTest): o jar do Paper (id do objeto = SHA-256) e, com -Pvoice/-Pmap, os plugins opcionais
paper_server_url=https://fill-data.papermc.io/v1/objects/64a5bd44910cb982b2648e9a35036cc95a6de4d561e15812aecf5411f84f7b01/paper-26.3-257.jar
paper_server_sha256=64a5bd44910cb982b2648e9a35036cc95a6de4d561e15812aecf5411f84f7b01
paper_voicechat_url=https://cdn.modrinth.com/data/9eGKb6K1/versions/3Br8wxJY/voicechat-bukkit-2.6.27.jar
paper_squaremap_url=https://cdn.modrinth.com/data/PFb7ZqK6/versions/YqUtyFYN/squaremap-paper-mc26.3-1.4.4.jar
